
name: Scrape XSKTVN

on:
  schedule:
    # 16:30 - 16:39 giờ Việt Nam
    - cron: "30 9 * * *"

    # 17:30 - 17:39 giờ Việt Nam
    - cron: "30 10 * * *"

    # 18:30 - 18:39 giờ Việt Nam
    - cron: "30 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

# Tránh hai tiến trình cùng cập nhật dữ liệu
concurrency:
  group: scrape-kqxs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r requirements.txt

      
      - name: Lấy dữ liệu và cập nhật GitHub
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Chạy thủ công: 1 lần
          # Chạy theo lịch: 10 lần
          if [ "$EVENT_NAME" = "schedule" ]; then
            TOTAL=10
          else
            TOTAL=1
          fi

          echo "Sự kiện: $EVENT_NAME"
          echo "Tổng số lần lấy dữ liệu: $TOTAL"

          for i in $(seq 1 "$TOTAL"); do
            echo "======================================"
            echo "Lần chạy $i/$TOTAL - $(date)"
            echo "======================================"

            python scraper.py --today-only

            git add data/

            if ! git diff --staged --quiet; then
              git commit -m "🤖 Cập nhật KQXS $(date -u +'%Y-%m-%d %H:%M')"

              git pull --rebase origin main
              git push origin HEAD:main

              echo "Đã cập nhật dữ liệu lên GitHub."
            else
              echo "Không có dữ liệu mới, bỏ qua commit."
            fi

            if [ "$i" -lt "$TOTAL" ]; then
              sleep 60
            fi
          done

          echo "Hoàn thành $TOTAL lần lấy dữ liệu."

